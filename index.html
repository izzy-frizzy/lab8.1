<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Flashcards App</title>
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 class="app-title">Flashcards</h1>
    <button class="btn btn--primary" type="button" data-action="new-card">New card</button>
  </header>

  <aside class="sidebar" aria-label="Decks">
    <h2 class="sidebar-title">Decks</h2>
    <ul class="deck-list" id="deck-list"></ul>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2 class="deck-name" id="deck-name"></h2>
      <p class="deck-meta" id="deck-meta"></p>
    </div>
    <section class="card-grid" id="card-grid" aria-label="Cards"></section>
  </main>

  <footer class="app-footer">Click a card to flip it.</footer>
</div>

<dialog id="card-dialog" aria-labelledby="dialog-title">
  <form id="card-form">
    <h2 class="dialog-title" id="dialog-title">New card</h2>
    <label class="field"><span>Front</span><textarea name="front" required></textarea></label>
    <label class="field"><span>Back</span><textarea name="back" required></textarea></label>
    <div class="dialog-actions">
      <button class="btn" type="button" data-action="cancel">Cancel</button>
      <button class="btn btn--primary" type="submit">Save card</button>
    </div>
  </form>
</dialog>
</body>
</html>
